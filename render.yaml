# Render blueprint: Basirah's API and web app as one service, one link.
# The keys and the specialists' accounts (sync: false) are entered in the
# dashboard, never committed.
services:
  - type: web
    name: basirah
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The closest region to the users in Saudi Arabia (fixed at creation).
    region: frankfurt
    # The smallest paid instance (0.5 CPU, 512 MB): always on, and it can
    # keep a disk. The free plan spins down after 15 minutes without
    # traffic, and the next visitor waits about a minute.
    plan: 0.5c-512mb
    healthCheckPath: /health
    # «لوحة الأثر» lives on this disk, so a deploy or a restart keeps it.
    disk:
      name: basirah-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: claude
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: CLAUDE_EFFORT
        value: medium
      # The last fallback, tried in order when Claude is unavailable.
      - key: GEMINI_MODEL
        value: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: METRICS_FILE
        value: /data/metrics.jsonl
      # The counts gathered on the temporary link, continued once.
      - key: METRICS_SEED
        value: /app/seed/metrics.jsonl
      # Requests to a Sharia specialist, kept 30 days on the same disk.
      - key: REFERRALS_FILE
        value: /data/referrals.json
      # The specialists' accounts (sign-in to /#/specialist), made by the team
      # with server/tool/specialist_account.dart: one username:salt:hash per
      # account, joined with ";". Entered in the dashboard (Environment).
      - key: SPECIALIST_ACCOUNTS
        sync: false
      # Optional, added later in the dashboard (Environment): NOTIFY_WEBHOOK,
      # a Slack or Discord webhook told of every new request (its code only;
      # the question is read in the panel).
