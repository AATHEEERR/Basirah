# Render blueprint: Basirah's API and web app as one service, one link.
# Set the AI key in the Render dashboard when asked — never commit it.
services:
  - type: web
    name: basirah
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    # Always on. The free plan spins down after 15 minutes without traffic,
    # and the next visitor waits about a minute.
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: claude
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5,claude-haiku-4-5
      - key: CLAUDE_EFFORT
        value: high
      - key: ALLOWED_ORIGIN
        value: "*"
